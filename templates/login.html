<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — Wahm Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#ecfdf5', 500:'#10b981', 600:'#059669', 700:'#047857', 900:'#064e3b' },
            ink: { 950:'#07110d' }
          },
          fontFamily: { sans: ['Tajawal', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Tajawal, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-bl from-emerald-950 via-slate-950 to-slate-900 text-white">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/15 border border-emerald-400/20 mb-4">
          <span class="text-3xl">💳</span>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">Wahm Pay</h1>
        <p class="text-emerald-100/70 mt-2">بوابة الدفع الذاتية — لوحة التحكم</p>
      </div>

      <div class="rounded-3xl bg-white/5 border border-white/10 shadow-2xl backdrop-blur p-8">
        <h2 class="text-xl font-bold mb-6">تسجيل الدخول</h2>

        {% if error %}
        <div class="mb-5 rounded-xl bg-red-500/15 border border-red-400/30 text-red-100 px-4 py-3 text-sm">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}" class="space-y-5">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div>
            <label for="password" class="block text-sm text-emerald-100/80 mb-2">كلمة مرور الأدمن</label>
            <input
              id="password"
              type="password"
              name="password"
              required
              autofocus
              autocomplete="current-password"
              class="w-full rounded-xl bg-slate-950/60 border border-white/15 px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-400"
              placeholder="أدخل كلمة المرور"
            />
          </div>
          <button
            type="submit"
            class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold py-3 transition"
          >
            دخول
          </button>
        </form>
      </div>

      <p class="text-center text-white/40 text-xs mt-6">Wahm Pay · آسيا/الرياض</p>
    </div>
  </div>
</body>
</html>
